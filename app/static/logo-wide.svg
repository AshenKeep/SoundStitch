<svg width="420" height="80" viewBox="0 0 420 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg2" cx="20%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#09090e"/>
    </radialGradient>
    <linearGradient id="wg2" x1="0" y1="40" x2="76" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a0c4ff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#a0c4ff"/>
      <stop offset="55%" stop-color="#c8b6ff"/>
      <stop offset="100%" stop-color="#c8b6ff" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="gp2"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="gs2"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background pill -->
  <rect width="420" height="80" rx="12" fill="url(#bg2)"/>
  <rect width="420" height="80" rx="12" fill="none" stroke="#c8b6ff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Logo icon (40px version) -->
  <!-- Needle -->
  <line x1="40" y1="11" x2="40" y2="59" stroke="#c8b6ff" stroke-width="2.5" stroke-linecap="round" filter="url(#gp2)"/>
  <!-- Eye -->
  <ellipse cx="40" cy="14" rx="3.5" ry="5" stroke="#a0c4ff" stroke-width="1.5" fill="#09090e"/>
  <!-- Tip -->
  <path d="M38 57 L40 65 L42 57" fill="#c8b6ff"/>
  <!-- Wave left -->
  <path d="M8 40 C11 40 13 29 17 29 C21 29 23 51 27 51 C31 51 33 33 36 33 C38 33 39 40 40 40"
        stroke="url(#wg2)" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#gs2)"/>
  <!-- Wave right -->
  <path d="M40 40 C41 40 43 46 47 46 C51 46 53 24 57 24 C61 24 63 43 67 43 C71 43 73 36 76 36"
        stroke="url(#wg2)" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#gs2)"/>
  <!-- Centre dot -->
  <circle cx="40" cy="40" r="3" fill="#c8b6ff" filter="url(#gp2)"/>
  <circle cx="40" cy="40" r="1.5" fill="#ffffff"/>

  <!-- Divider line -->
  <line x1="98" y1="18" x2="98" y2="62" stroke="#c8b6ff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Wordmark "SoundStitch" -->
  <text x="116" y="47" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.5" fill="#c8b6ff">SoundStitch</text>

  <!-- Tagline -->
  <text x="116" y="64" font-family="'Segoe UI Mono', 'Consolas', monospace"
        font-size="10" letter-spacing="0.12em" fill="#5a5475" text-transform="uppercase">PLAYLIST SYNC ENGINE</text>

  <!-- Version badge -->
  <rect x="340" y="28" width="56" height="18" rx="3" fill="#1c1c2a"/>
  <text x="368" y="41" font-family="'Segoe UI Mono', 'Consolas', monospace"
        font-size="10" fill="#a89ec9" text-anchor="middle" letter-spacing="0.05em">v0.4.0</text>
</svg>
